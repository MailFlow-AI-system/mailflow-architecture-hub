name: Validate architecture hub

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      - run: bun run diagram-sources:check
      - run: bun run coverage:check
      - run: bun run build
      - run: bun run validate:dist
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run test:a11y
